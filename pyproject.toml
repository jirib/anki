[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ankiscripts"
version = "0.1.0"
description = "Build Anki .apkg decks from CSV or Excel sources"
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.0",
    "openpyxl>=3.1",
]

[project.scripts]
csv2apkg = "ankiscripts.csv:main"
xlsx2apkg = "ankiscripts.xlsx:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["ankiscripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
